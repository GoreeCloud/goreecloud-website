name: Temporary v5.20 PR patch

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/v5-20-portfolio-metadata-optimization'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 0

      - name: Correct reviewed helper assumption
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/agent_v5_20_patch.py')
          text = path.read_text(encoding='utf-8')
          old = '''replace_once(
              "README.md",
              "The v5.19.0 Glaze UI alignment does not add authentication, authorization, a backend API, application storage, visitor analytics, browser error export, session replay, fingerprinting, remote telemetry, search telemetry, or query persistence.",
              "The v5.20.0 portfolio and metadata release does not add authentication, authorization, a backend API, application storage, visitor analytics, browser error export, session replay, fingerprinting, remote telemetry, search telemetry, or query persistence.",
          )
          '''
          if old not in text:
              raise SystemExit('Expected README-only helper block was not found')
          path.write_text(text.replace(old, '', 1), encoding='utf-8')
          PY

      - name: Apply exact source patch
        run: python scripts/agent_v5_20_patch.py

      - name: Validate patched source before commit
        run: |
          python scripts/validate_repository_portfolio.py
          python scripts/validate_public_surface.py
          python scripts/validate_performance_budget.py
          python scripts/validate_accessibility.py
          python scripts/validate_glaze_ui.py
          python scripts/validate_privacy_policy.py
          python scripts/validate_security_policy.py
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Commit patched source
        run: |
          git config user.name "GoreeCloud Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Optimize website portfolio and public metadata"
          git push origin HEAD:agent/v5-20-portfolio-metadata-optimization
