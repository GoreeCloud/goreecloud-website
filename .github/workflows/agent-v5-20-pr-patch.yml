name: Temporary v5.20 PR patch

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/v5-20-portfolio-metadata-optimization'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 0

      - name: Correct reviewed helper assumptions
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/agent_v5_20_patch.py')
          text = path.read_text(encoding='utf-8')

          old_readme_block = '''replace_once(
              "README.md",
              "The v5.19.0 Glaze UI alignment does not add authentication, authorization, a backend API, application storage, visitor analytics, browser error export, session replay, fingerprinting, remote telemetry, search telemetry, or query persistence.",
              "The v5.20.0 portfolio and metadata release does not add authentication, authorization, a backend API, application storage, visitor analytics, browser error export, session replay, fingerprinting, remote telemetry, search telemetry, or query persistence.",
          )
          '''
          if old_readme_block not in text:
              raise SystemExit('Expected README-only helper block was not found')
          text = text.replace(old_readme_block, '', 1)

          for call in (
              'insert_before_once("privacy.html", "</head>", privacy_social)\n',
              'insert_before_once("security.html", "</head>", security_social)\n',
          ):
              if call not in text:
                  raise SystemExit(f'Expected optional social metadata call was not found: {call.strip()}')
              text = text.replace(call, '', 1)

          old_loop = '''    for page, canonical in INDEXABLE_PAGES.items():
                  parser = parsed_pages.get(page.resolve())
          '''
          new_loop = '''    for page, canonical in INDEXABLE_PAGES.items():
                  if page.name not in {"index.html", "repositories.html"}:
                      continue
                  parser = parsed_pages.get(page.resolve())
          '''
          if old_loop not in text:
              raise SystemExit('Expected social-metadata validation loop was not found')
          text = text.replace(old_loop, new_loop, 1)

          text = text.replace(
              'completes Open Graph/Twitter metadata across every indexable page',
              'completes Open Graph/Twitter metadata for the public repository directory',
          )
          text = text.replace(
              '- completes page-specific Open Graph and Twitter metadata across every indexable page and validates canonical social URL/image identity;',
              '- completes Open Graph and Twitter metadata for the repository directory and validates its canonical social URL/image identity;',
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply exact source patch
        run: python scripts/agent_v5_20_patch.py

      - name: Validate patched source before commit
        run: |
          python scripts/validate_repository_portfolio.py
          python scripts/validate_public_surface.py
          python scripts/validate_performance_budget.py
          python scripts/validate_accessibility.py
          python scripts/validate_glaze_ui.py
          python scripts/validate_privacy_policy.py
          python scripts/validate_security_policy.py
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Commit patched source
        run: |
          git config user.name "GoreeCloud Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Optimize website portfolio and public metadata"
          git push origin HEAD:agent/v5-20-portfolio-metadata-optimization
