name: Temporary v5.20 PR patch

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/v5-20-portfolio-metadata-optimization'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 0

      - name: Correct reviewed helper assumptions
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/agent_v5_20_patch.py')
          text = path.read_text(encoding='utf-8')

          old_readme_block = '''replace_once(
              "README.md",
              "The v5.19.0 Glaze UI alignment does not add authentication, authorization, a backend API, application storage, visitor analytics, browser error export, session replay, fingerprinting, remote telemetry, search telemetry, or query persistence.",
              "The v5.20.0 portfolio and metadata release does not add authentication, authorization, a backend API, application storage, visitor analytics, browser error export, session replay, fingerprinting, remote telemetry, search telemetry, or query persistence.",
          )
          '''
          if old_readme_block not in text:
              raise SystemExit('Expected README-only helper block was not found')
          text = text.replace(old_readme_block, '', 1)

          for call in (
              'insert_before_once("privacy.html", "</head>", privacy_social)\n',
              'insert_before_once("security.html", "</head>", security_social)\n',
          ):
              if call not in text:
                  raise SystemExit(f'Expected optional social metadata call was not found: {call.strip()}')
              text = text.replace(call, '', 1)

          old_loop = "    for page, canonical in INDEXABLE_PAGES.items():\n        parser = parsed_pages.get(page.resolve())\n"
          new_loop = "    for page, canonical in INDEXABLE_PAGES.items():\n        if page.name not in {\"index.html\", \"repositories.html\"}:\n            continue\n        parser = parsed_pages.get(page.resolve())\n"
          if old_loop not in text:
              raise SystemExit('Expected social-metadata validation loop was not found')
          text = text.replace(old_loop, new_loop, 1)

          for line in (
              '  <meta property="og:locale" content="en_US">\n',
              '  <meta property="og:image:type" content="image/png">\n',
              '  <meta property="og:image:width" content="1200">\n',
              '  <meta property="og:image:height" content="630">\n',
              '  <meta name="twitter:site" content="@GoreeCloud">\n',
              '            "og:locale": "en_US",\n',
              '            "og:image:type": "image/png",\n',
              '            "og:image:width": "1200",\n',
              '            "og:image:height": "630",\n',
              '            "twitter:site": "@GoreeCloud",\n',
          ):
              text = text.replace(line, '')

          compact_replacements = {
              'GoreeCloud-maintained Android keyboard project based on CleverKeys.': 'Android keyboard project based on CleverKeys.',
              'Develop private on-device text input with swipe typing, dictionaries, clipboard productivity, and GoreeCloud-specific workflows.': 'Private on-device typing, swipe input, dictionaries, clipboard tools, and GoreeCloud workflows.',
              'Android input method and productivity client under active development.': 'Android input method in active development.',
              'Native GoreeCloud historical change-ledger application in active development.': 'Native historical change ledger in active development.',
              'Build searchable, append-only GoreeCloud change history across web, API, import/export, and future mobile workflows.': 'Searchable, append-only GoreeCloud history across web, API, import/export, and mobile workflows.',
              'Historical change-management platform; production migration and acceptance remain pending.': 'Change-management platform; production migration remains pending.',
              'Private development repository • migration pending': 'Private repository • migration pending',
          }
          for old, new in compact_replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected compactable repository text was not found: {old}')
              text = text.replace(old, new)

          text = text.replace(
              'completes Open Graph/Twitter metadata across every indexable page',
              'completes Open Graph/Twitter metadata for the public repository directory',
          )
          text = text.replace(
              '- completes page-specific Open Graph and Twitter metadata across every indexable page and validates canonical social URL/image identity;',
              '- completes Open Graph and Twitter metadata for the repository directory and validates its canonical social URL/image identity;',
          )

          marker = 'manifest_path = ROOT / "site.webmanifest"\n'
          compaction = '''repo_text = read("repositories.html")
          card_indent = '            <article class="repo-card'
          if repo_text.count(card_indent) != 30:
              raise SystemExit(f"repositories.html: expected 30 compactable repository cards, found {repo_text.count(card_indent)}")
          repo_text = repo_text.replace(card_indent, '  <article class="repo-card')
          write("repositories.html", repo_text)

          '''
          if marker not in text:
              raise SystemExit('Expected repository compaction insertion marker was not found')
          text = text.replace(marker, compaction + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply exact source patch
        run: python scripts/agent_v5_20_patch.py

      - name: Validate patched source before commit
        run: |
          python scripts/validate_repository_portfolio.py
          python scripts/validate_public_surface.py
          python scripts/validate_performance_budget.py
          python scripts/validate_accessibility.py
          python scripts/validate_glaze_ui.py
          python scripts/validate_privacy_policy.py
          python scripts/validate_security_policy.py
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Commit patched source
        run: |
          git config user.name "GoreeCloud Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Optimize website portfolio and public metadata"
          git push origin HEAD:agent/v5-20-portfolio-metadata-optimization
