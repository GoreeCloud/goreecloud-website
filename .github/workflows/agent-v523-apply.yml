name: Apply v5.23 official artwork release tree

on:
  push:
    branches:
      - agent/v5-23-official-artwork-release

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact release branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13.14'

      - name: Materialize validated v5.23 release tree
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin refs/heads/agent/v5-23-official-artwork:refs/remotes/origin/agent/v5-23-official-artwork
          git show origin/agent/v5-23-official-artwork:scripts/v523_base.py > scripts/v523_base.py
          git show origin/agent/v5-23-official-artwork:scripts/validate_repository_hygiene.py > scripts/v523_driver.py

          set +e
          python scripts/v523_driver.py > /tmp/v523-materialize.log 2>&1
          materialize_status=$?
          set -e

          tail -n 30 /tmp/v523-materialize.log
          grep -q '^V523_EXPORT_COMPLETE$' /tmp/v523-materialize.log
          test "$materialize_status" -eq 1

          rm -f scripts/v523_base.py scripts/v523_driver.py .github/workflows/agent-v523-apply.yml

          git diff --exit-code origin/main -- scripts/validate_repository_hygiene.py
          python scripts/validate_repository_hygiene.py
          python scripts/validate_site.py

          git config user.name 'GoreeCloud'
          git config user.email '295260680+GoreeCloud@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No release changes were produced.' >&2; exit 1; }
          git commit -m 'Use official artwork across the public website'
          git push origin HEAD:refs/heads/agent/v5-23-official-artwork-release
