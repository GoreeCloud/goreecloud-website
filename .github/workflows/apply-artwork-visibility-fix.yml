name: Apply artwork visibility fix
on:
  push:
    branches:
      - agent/fix-missing-card-artwork
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 1
      - run: python3 scripts/apply_artwork_visibility_fix.py
      - run: |
          git diff --check
          python3 -m unittest tests.test_homepage_artwork_visibility
      - run: |
          git config user.name "GoreeCloud Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html css/platform.css scripts/build_public_site.py docs/visual-identity-sources.json tests/test_homepage_artwork_visibility.py
          git commit -m "Restore missing homepage artwork"
          git push origin HEAD:agent/fix-missing-card-artwork
