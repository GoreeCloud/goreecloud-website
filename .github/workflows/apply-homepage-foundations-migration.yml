name: Apply homepage foundations migration

on:
  push:
    branches:
      - agent/homepage-platform-foundations

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Apply deterministic homepage migration
        run: python3 scripts/apply_homepage_foundations_migration.py

      - name: Validate patch shape
        run: |
          git diff --check
          git diff --exit-code -- scripts/apply_homepage_foundations_migration.py .github/workflows/apply-homepage-foundations-migration.yml
          test "$(git diff --name-only | tr '\n' ' ')" = "index.html "

      - name: Commit homepage integration
        run: |
          git config user.name "GoreeCloud Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html
          git commit -m "Integrate platform foundations into homepage"
          git push origin HEAD:agent/homepage-platform-foundations
