name: Build GoreeCloud Gallery gc.5 APK

on:
  push:
    branches:
      - build/goreecloud-gallery-apk
    paths:
      - .github/scripts/build_goreecloud_gallery.py
      - .github/scripts/build_goreecloud_gallery_gc2.py
      - .github/scripts/build_goreecloud_gallery_gc3.py
      - .github/scripts/build_goreecloud_gallery_gc4.py
      - .github/scripts/build_goreecloud_gallery_gc5.py
      - .github/workflows/build-goreecloud-gallery-gc5-apk.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goreecloud-gallery-gc5-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out isolated build carrier
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Clone exact Fossify Gallery baseline
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/FossifyOrg/Gallery.git upstream-gallery
          git -C upstream-gallery checkout --detach b28299dc33821eee8d108a9880ce87876cf31443
          test "$(git -C upstream-gallery rev-parse HEAD)" = "b28299dc33821eee8d108a9880ce87876cf31443"

      - name: Clone exact Fossify Commons baseline
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/FossifyOrg/commons.git upstream-commons
          git -C upstream-commons checkout --detach acfd352df1a1852d17a5f77def8b7ad6e522a5b6
          test "$(git -C upstream-commons rev-parse HEAD)" = "acfd352df1a1852d17a5f77def8b7ad6e522a5b6"

      - name: Apply GoreeCloud gc.1 foundation
        run: python3 .github/scripts/build_goreecloud_gallery.py upstream-gallery

      - name: Apply GoreeCloud gc.2 corrections
        run: python3 .github/scripts/build_goreecloud_gallery_gc2.py upstream-gallery upstream-commons

      - name: Apply GoreeCloud gc.3 corrections
        run: python3 .github/scripts/build_goreecloud_gallery_gc3.py upstream-gallery upstream-commons

      - name: Apply GoreeCloud gc.4 Glaze refinements
        run: python3 .github/scripts/build_goreecloud_gallery_gc4.py upstream-gallery upstream-commons

      - name: Apply GoreeCloud gc.5 acceptance and readiness hardening
        run: |
          python3 .github/scripts/build_goreecloud_gallery_gc5.py upstream-gallery upstream-commons
          python3 -c 'from pathlib import Path; p=Path("upstream-gallery/settings.gradle.kts"); p.write_text(p.read_text().rstrip() + "\n")'
          git -C upstream-gallery diff --check
          git -C upstream-commons diff --check

          ! grep -R -Fq "You are using a fake version of the app" upstream-commons/commons/src/main
          ! grep -R -Fq "download the original one from www.fossify.org. Thanks" upstream-commons/commons/src/main

          grep -Fq 'FOLDER_STYLE_ROUNDED_CORNERS' upstream-gallery/app/src/main/kotlin/org/fossify/gallery/helpers/Config.kt
          grep -Fq 'prefs.getBoolean(FILE_ROUNDED_CORNERS, true)' upstream-gallery/app/src/main/kotlin/org/fossify/gallery/helpers/Config.kt
          grep -Fq 'getProperBackgroundColor().getContrastColor() == Color.WHITE' upstream-commons/commons/src/main/kotlin/org/fossify/commons/extensions/Context-styling.kt

          git -C upstream-gallery status --short
          git -C upstream-commons status --short

      - name: Run Android unit tests and lint
        working-directory: upstream-gallery
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:testFossDebugUnitTest :app:lintFossDebug

      - name: Build installable FOSS APK
        working-directory: upstream-gallery
        run: ./gradlew --no-daemon --stacktrace :app:assembleFossDebug

      - name: Collect and validate APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t apks < <(find upstream-gallery/app/build/outputs/apk/foss/debug -type f -name '*.apk' | sort)
          test "${#apks[@]}" -eq 1
          cp "${apks[0]}" dist/GoreeCloud-Gallery-1.0.0-gc.5.apk

          APK="dist/GoreeCloud-Gallery-1.0.0-gc.5.apk"
          test -s "$APK"
          unzip -p "$APK" assets/goreecloud_notice.txt | grep -F "GoreeCloud Gallery 1.0.0-gc.5"

          APKANALYZER=""
          if command -v apkanalyzer >/dev/null 2>&1; then
            APKANALYZER="$(command -v apkanalyzer)"
          elif [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" ]; then
            APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          fi

          if [ -n "$APKANALYZER" ]; then
            test "$($APKANALYZER manifest application-id "$APK")" = "com.goreecloud.gallery"
            ! $APKANALYZER manifest permissions "$APK" | grep -Fq "android.permission.INTERNET"
          else
            echo "apkanalyzer unavailable; package/permission validation will rely on source assertions and successful Android packaging"
          fi

          mapfile -t dex_files < <(zipinfo -1 "$APK" | grep -E '^classes([0-9]+)?\.dex$' | sort)
          test "${#dex_files[@]}" -ge 1
          mkdir -p dex-validation
          for dex in "${dex_files[@]}"; do
            safe_name="${dex//\//_}"
            unzip -p "$APK" "$dex" > "dex-validation/$safe_name"
            strings "dex-validation/$safe_name" > "dex-validation/$safe_name.strings"
            if grep -Fq "You are using a fake version of the app" "dex-validation/$safe_name.strings"; then
              echo "Fossify counterfeit warning found in packaged $dex" >&2
              exit 1
            fi
            if grep -Fq "download the original one from www.fossify.org. Thanks" "dex-validation/$safe_name.strings"; then
              echo "Fossify counterfeit promotion found in packaged $dex" >&2
              exit 1
            fi
          done

          unzip -l "$APK" | grep -Fq "res/"
          sha256sum "$APK" | tee dist/GoreeCloud-Gallery-1.0.0-gc.5.sha256
          cp upstream-gallery/GOREECLOUD-NOTICE.md dist/GOREECLOUD-NOTICE.md
          cp upstream-gallery/LICENSE dist/LICENSE-GPL-3.0.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoreeCloud-Gallery-gc5-APK
          path: dist/
          if-no-files-found: error
          retention-days: 30
