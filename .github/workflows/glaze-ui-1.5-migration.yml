name: Migrate public websites to Glaze UI 1.5 Stable

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/glaze-ui-1.5-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vendor Glaze UI 1.5.0 and refresh public surfaces
        shell: python
        run: |
          from pathlib import Path
          import re
          import urllib.request

          root = Path.cwd()
          revision = "2c5078410d022eba683c8e029bc3cafe773df0b7"
          files = [
              "glaze.css",
              "glaze.controls.css",
              "glaze.expressive.css",
              "glaze.formfactors.css",
              "glaze.accessibility.css",
              "glaze.color.css",
              "glaze.motion.css",
              "glaze.materials.css",
              "glaze.layout.css",
              "glaze.states.css",
          ]
          base = f"https://raw.githubusercontent.com/GoreeCloud/goreecloud-glaze-ui/{revision}/css"
          parts = [
              "/* GoreeCloud Glaze UI 1.5.0 Stable — vendored production bundle. */",
              f"/* Canonical source revision: {revision}. */",
          ]
          for name in files:
              with urllib.request.urlopen(f"{base}/{name}", timeout=30) as response:
                  parts.append(f"\n/* ===== {name} ===== */\n" + response.read().decode("utf-8"))

          parts.append(r'''
          /* ===== GoreeCloud public-site 1.5 integration ===== */
          body.glaze-canvas {
            margin: 0;
            min-height: 100vh;
            color: var(--glaze-text);
            font-family: var(--glaze-font-sans);
            background:
              radial-gradient(circle at 12% -8%, color-mix(in srgb, var(--glaze-accent) 14%, transparent), transparent 34rem),
              radial-gradient(circle at 88% 2%, color-mix(in srgb, var(--glaze-accent-2) 10%, transparent), transparent 30rem),
              linear-gradient(180deg, var(--glaze-canvas-accent), var(--glaze-canvas));
          }
          .site-header {
            border-bottom: 1px solid var(--glaze-line);
            background: color-mix(in srgb, var(--glaze-surface-strong) 82%, transparent);
            -webkit-backdrop-filter: blur(var(--glaze-blur)) saturate(135%);
            backdrop-filter: blur(var(--glaze-blur)) saturate(135%);
            box-shadow: 0 10px 34px color-mix(in srgb, var(--glaze-text) 5%, transparent);
          }
          .hero-panel, .glass-card, .app-card, .project-card, .post-card, .archive-card,
          .website-card, .repository-card, .status-card, .surface-card, .principle-grid > div {
            border: 1px solid var(--glaze-line);
            border-radius: var(--glaze-radius-xl);
            background: color-mix(in srgb, var(--glaze-surface-strong) 91%, transparent);
            box-shadow: var(--glaze-shadow-soft);
          }
          .hero, .section, .section-block { scroll-margin-top: 6rem; }
          .button, button, .theme-button, .theme-toggle, .appearance-control {
            min-height: var(--glaze-target-min);
            border-radius: var(--glaze-radius-control);
            transition: transform var(--glaze-motion-fast) var(--glaze-ease-standard),
                        box-shadow var(--glaze-motion-fast) var(--glaze-ease-standard),
                        background-color var(--glaze-motion-fast) var(--glaze-ease-standard),
                        border-color var(--glaze-motion-fast) var(--glaze-ease-standard);
          }
          nav a, .chip, .badge, .eyebrow {
            border-radius: var(--glaze-radius-pill);
          }
          a:focus-visible, button:focus-visible, [tabindex]:focus-visible {
            outline: var(--glaze-focus-width) solid var(--glaze-accent);
            outline-offset: var(--glaze-focus-offset);
          }
          @media (hover: hover) and (pointer: fine) {
            .app-card:hover, .project-card:hover, .post-card:hover, .archive-card:hover,
            .website-card:hover, .repository-card:hover, .glass-card:hover {
              transform: translateY(-2px);
              box-shadow: var(--glaze-shadow-raised);
            }
            .button:hover, button:hover { transform: translateY(-1px); }
          }
          @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
              scroll-behavior: auto !important;
              animation-duration: 0.001ms !important;
              animation-iteration-count: 1 !important;
              transition-duration: 0ms !important;
            }
          }
          @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
            .site-header { background: var(--glaze-surface-strong); }
          }
          ''')
          bundle = "\n".join(parts).replace("          ", "")

          targets = [
              root / "css/glaze-ui-1.5.0.css",
              root / "sites/projects/assets/glaze-ui-1.5.0.css",
              root / "sites/roadmap/glaze-ui-1.5.0.css",
              root / "sites/blog/glaze-ui-1.5.0.css",
              root / "sites/archive/glaze-ui-1.5.0.css",
          ]
          for target in targets:
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(bundle, encoding="utf-8")

          def patch_html(path: Path, href: str) -> None:
              text = path.read_text(encoding="utf-8")
              meta = '  <meta name="goreecloud-glaze-ui" content="1.5.0">\n'
              link = f'  <link rel="stylesheet" href="{href}" data-glaze-ui="1.5.0">\n'
              if 'name="goreecloud-glaze-ui"' not in text:
                  text = text.replace("</head>", meta + link + "</head>", 1)
              elif 'data-glaze-ui="1.5.0"' not in text:
                  text = text.replace("</head>", link + "</head>", 1)
              if "glaze-canvas" not in text.split("</head>", 1)[-1].split(">", 1)[0]:
                  text = re.sub(r'<body(?![^>]*\bclass=)([^>]*)>', r'<body class="glaze-canvas"\1>', text, count=1)
                  text = re.sub(
                      r'<body([^>]*\bclass=")([^"]*)"',
                      lambda m: m.group(0) if "glaze-canvas" in m.group(2).split() else f'<body{m.group(1)}{m.group(2)} glaze-canvas"',
                      text,
                      count=1,
                  )
              path.write_text(text, encoding="utf-8")

          for name in ("index.html", "privacy.html", "security.html", "repositories.html", "404.html"):
              patch_html(root / name, "/css/glaze-ui-1.5.0.css")
          for site, href in (
              ("projects", "/assets/glaze-ui-1.5.0.css"),
              ("roadmap", "/glaze-ui-1.5.0.css"),
              ("blog", "/glaze-ui-1.5.0.css"),
              ("archive", "/glaze-ui-1.5.0.css"),
          ):
              for name in ("index.html", "404.html"):
                  path = root / "sites" / site / name
                  if path.exists():
                      patch_html(path, href)

          build = root / "scripts/build_public_site.py"
          text = build.read_text(encoding="utf-8")
          marker = '    "css/glaze.css",\n'
          if '"css/glaze-ui-1.5.0.css"' not in text:
              text = text.replace(marker, marker + '    "css/glaze-ui-1.5.0.css",\n', 1)
          build.write_text(text, encoding="utf-8")

          conformance = root / "docs/glaze-ui-conformance.md"
          if conformance.exists():
              text = conformance.read_text(encoding="utf-8")
              text = text.replace("**1.1.0**", "**1.5.0**")
              text = text.replace("Glaze UI 1.1", "Glaze UI 1.5")
              text = text.replace("1.1 adoption", "1.5 adoption")
              text = text.replace("the 1.1", "the 1.5")
              text = text.replace("GoreeCloud/glaze-ui", "GoreeCloud/goreecloud-glaze-ui")
              text = re.sub(r'Canonical reference revision reviewed for this alignment: `[^`]+`', f'Canonical reference revision reviewed for this alignment: `{revision}`', text)
              if "Stable 1.5 production mapping" not in text:
                  text += f'''\n\n## Stable 1.5 production mapping\n\nThe public website now vendors the canonical Stable 1.5 web stylesheet set from `GoreeCloud/goreecloud-glaze-ui` at `{revision}` into each independently deployed public surface. The bundle is local to every deployment and adds the current adaptive color, material, motion, layout/density, accessibility, component, state, and Mobile/Tablet/Desktop/TV semantics without creating a cross-domain runtime dependency.\n'''
              conformance.write_text(text, encoding="utf-8")

          validator = root / "scripts/validate_glaze_ui.py"
          if validator.exists():
              text = validator.read_text(encoding="utf-8")
              text = text.replace("1.1.0", "1.5.0").replace("Glaze UI 1.1", "Glaze UI 1.5")
              text = text.replace("GoreeCloud/glaze-ui", "GoreeCloud/goreecloud-glaze-ui")
              validator.write_text(text, encoding="utf-8")

          adoption = root / "docs/glaze-ui-1.5-public-sites.md"
          adoption.write_text(f'''# Glaze UI 1.5.0 public-site adoption\n\n- Stable target: **1.5.0**\n- Canonical repository: `GoreeCloud/goreecloud-glaze-ui`\n- Source revision: `{revision}`\n- Surfaces: Main, Projects, Roadmap, Blog, Archive\n- Delivery: vendored, same-origin CSS bundle per independently deployed surface\n- Runtime dependency on Design Center: none\n- Candidate/Wearable layers: excluded from production adoption\n\nThe bundle follows the Design Center Stable web order: core, controls, expressive, form factors, accessibility, adaptive color, motion, materials, layout, and states. A public-site integration layer maps those semantics onto existing GoreeCloud website cards, navigation, controls, focus behavior, motion, and fallbacks while preserving each site's information architecture.\n''', encoding="utf-8")

      - name: Validate migration
        run: |
          python3 scripts/build_public_site.py
          python3 scripts/validate_glaze_ui.py
          python3 scripts/validate_archive_site.py
          python3 scripts/validate_blog_site.py
          python3 sites/projects/validate.py
          python3 sites/roadmap/validate.py
      - name: Commit migration
        run: |
          git config user.name "GoreeCloud"
          git config user.email "295260680+GoreeCloud@users.noreply.github.com"
          git add css/glaze-ui-1.5.0.css sites scripts docs index.html privacy.html security.html repositories.html 404.html
          if git diff --cached --quiet; then
            echo "Glaze UI 1.5.0 migration already applied"
          else
            git commit -m "Adopt Glaze UI 1.5 Stable across public websites"
            git push
          fi
