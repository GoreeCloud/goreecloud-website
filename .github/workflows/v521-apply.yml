name: Apply v5.21 platform identity hardening

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/v5-21-platform-identity-hardening'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.14"

      - name: Apply exact v5.21 migration
        run: python scripts/apply_v521.py

      - name: Validate migrated source before commit
        run: |
          python scripts/validate_public_assets.py
          python scripts/validate_accessibility.py
          python scripts/validate_glaze_ui.py
          python scripts/validate_browser_origin_integrity.py
          python scripts/validate_public_surface.py
          python scripts/validate_performance_budget.py
          python scripts/build_public_site.py
          python scripts/validate_build_artifact.py
          python -m unittest discover -s tests -p "test_*.py"

      - name: Remove one-time migration tooling
        run: |
          rm scripts/apply_v521.py
          rm .github/workflows/v521-apply.yml

      - name: Commit migrated source
        run: |
          git config user.name "GoreeCloud"
          git config user.email "295260680+GoreeCloud@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden public platform identity assets for v5.21.0"
          git push origin HEAD:${GITHUB_HEAD_REF}
