name: Apply final v5.21 native platform-mark migration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/v5-21-native-platform-marks-final'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.14"

      - name: Apply guarded source migration
        run: python scripts/apply_v521_native_platform_marks.py

      - name: Normalize v5.21 asset-boundary regression markers
        run: |
          python - <<'PY'
          from pathlib import Path

          old = "historical commits may still contain prior third-party artwork blobs"
          new = "Historical commits may still contain prior third-party artwork blobs"
          for relative in ("scripts/validate_public_assets.py", "tests/test_public_assets.py"):
              path = Path(relative)
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"Expected one generated marker in {relative}; found {text.count(old)}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          test_path = Path("tests/test_public_asset_inventory.py")
          text = test_path.read_text(encoding="utf-8")
          old_required = '''        required = (
            "not a license grant",
            "provenance and rights verification still required",
            "source-code license must not be assumed to relicense third-party marks",
            "integrity fingerprint only",
            "does not establish copyright ownership",
            "issue #5 remains open",
        )'''
          new_required = '''        required = (
            "not a license grant",
            "third-party deployable logo artwork: none",
            "current source tree",
            "historical commits may still contain prior third-party artwork blobs",
            "integrity fingerprint only",
            "does not establish copyright ownership",
            "issue #5 remains open",
            "explicit repository visibility/publication decision",
        )'''
          if text.count(old_required) != 1:
              raise SystemExit(f"Expected one legacy publication-boundary marker block; found {text.count(old_required)}")
          test_path.write_text(text.replace(old_required, new_required, 1), encoding="utf-8")
          PY

      - name: Run focused v5.21 validation
        run: |
          python scripts/validate_public_assets.py
          python scripts/validate_public_surface.py
          python scripts/validate_accessibility.py
          python scripts/validate_glaze_ui.py
          python scripts/validate_browser_origin_integrity.py
          python scripts/validate_performance_budget.py
          python scripts/build_public_site.py
          python scripts/validate_build_artifact.py
          python -m unittest discover -s tests -p "test_*.py"

      - name: Commit release source and self-remove setup
        run: |
          git config user.name "GoreeCloud Release Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply_v521_native_platform_marks.py .github/workflows/v521-final-migration.yml
          git add -A
          git commit -m "Minimize public artwork and unify platform marks"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
