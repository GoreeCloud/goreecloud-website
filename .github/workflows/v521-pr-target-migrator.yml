name: Temporary v5.21 same-repository migration bridge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/v5-21-pr-target-setup'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out exact same-repository pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.14"

      - name: Apply guarded v5.21 source migration
        run: |
          python scripts/apply_v521_native_platform_marks.py
          python - <<'PY'
          from pathlib import Path

          old = "historical commits may still contain prior third-party artwork blobs"
          new = "Historical commits may still contain prior third-party artwork blobs"
          for relative in ("scripts/validate_public_assets.py", "tests/test_public_assets.py"):
              path = Path(relative)
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"Expected one generated marker in {relative}; found {text.count(old)}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          inventory = Path("docs/public-asset-inventory.md")
          text = inventory.read_text(encoding="utf-8")
          marker = "## Publication gate\n"
          historical = """## Historical third-party artwork note

Provenance and rights verification still required for any future artwork addition and for final historical-repository publication review. The source-code license must not be assumed to relicense third-party marks.

Simple Icons disclaimer: an earlier website state used third-party platform artwork obtained through an intermediary icon library. Those SVG logo files are no longer part of the current source tree or deployable public artifact. This historical note records provenance context only and does not grant reuse rights.

"""
          if "Simple Icons disclaimer" not in text:
              if marker not in text:
                  raise SystemExit("Public asset inventory publication gate marker is missing.")
              inventory.write_text(text.replace(marker, historical + marker, 1), encoding="utf-8")
          PY
          git rm scripts/apply_v521_native_platform_marks.py .github/workflows/v521-pr-target-migrator.yml

      - name: Validate exact transformed source
        run: |
          python scripts/validate_workflow_security.py
          python scripts/validate_repository_hygiene.py
          python scripts/validate_repository_history.py
          python scripts/validate_license.py
          python scripts/validate_public_assets.py
          python scripts/validate_governance_readiness.py
          python scripts/validate_repository_portfolio.py
          python scripts/validate_public_runtime_status.py
          python scripts/validate_security_policy.py
          python scripts/validate_wardveil_observability.py
          python scripts/validate_privacy_policy.py
          python scripts/validate_browser_origin_integrity.py
          python scripts/validate_accessibility.py
          python scripts/validate_glaze_ui.py
          python scripts/validate_app_identity.py
          python scripts/validate_public_semantics.py
          python scripts/validate_public_surface.py
          python scripts/validate_deployment_contract.py
          python scripts/validate_performance_budget.py
          python scripts/build_public_site.py
          python scripts/validate_build_artifact.py
          python scripts/verify_remote_deployment.py --check-config
          python -m unittest discover -s tests -p "test_*.py"
          python scripts/validate_repository_guidance.py
          python scripts/validate_release_evidence.py

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.0"

      - name: Validate aggregate site and JavaScript
        run: |
          python scripts/validate_site.py
          python scripts/validate_resilience.py
          node --check js/theme-init.js
          node --check js/main.js

      - name: Commit validated transformed source
        run: |
          git config user.name "GoreeCloud Release Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Minimize public artwork and unify platform marks"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
