name: Validate five-product website source

on:
  pull_request:
    paths:
      - 'sites/labs/**'
      - 'css/site-v1.1.css'
      - 'js/main.js'
      - 'js/theme-init.js'
      - 'scripts/glaze_v1.py'
      - '.github/workflows/validate-labs-site.yml'
  push:
    branches: [main]
    paths:
      - 'sites/labs/**'
      - 'css/site-v1.1.css'
      - 'js/main.js'
      - 'js/theme-init.js'
      - 'scripts/glaze_v1.py'
      - '.github/workflows/validate-labs-site.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.14'
      - name: Compile site tools
        run: python -m py_compile scripts/glaze_v1.py sites/labs/build.py sites/labs/validate.py
      - name: Validate reviewed source
        run: python sites/labs/validate.py
      - name: Build isolated Pages artifact
        run: python sites/labs/build.py
      - name: Validate built artifact
        run: python sites/labs/validate.py
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.0'
      - name: Check JavaScript syntax
        run: |
          node --check js/theme-init.js
          node --check js/main.js
