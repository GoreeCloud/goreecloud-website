name: Validate public website

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: website-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/v5-21-native-platform-marks-final' }}
          fetch-depth: 0

      - name: Detect guarded v5.21 migration
        id: v521
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.head.ref }}" = "agent/v5-21-native-platform-marks-final" ] && test -f scripts/apply_v521_native_platform_marks.py; then
            echo 'active=true' >> "$GITHUB_OUTPUT"
          else
            echo 'active=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.14"

      - name: Apply guarded v5.21 migration in working tree
        if: steps.v521.outputs.active == 'true'
        run: |
          python scripts/apply_v521_native_platform_marks.py
          python - <<'PY'
          from pathlib import Path

          old = "historical commits may still contain prior third-party artwork blobs"
          new = "Historical commits may still contain prior third-party artwork blobs"
          for relative in ("scripts/validate_public_assets.py", "tests/test_public_assets.py"):
              path = Path(relative)
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"Expected one generated marker in {relative}; found {text.count(old)}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          test_path = Path("tests/test_public_asset_inventory.py")
          text = test_path.read_text(encoding="utf-8")
          old_required = '''        required = (
            "not a license grant",
            "provenance and rights verification still required",
            "source-code license must not be assumed to relicense third-party marks",
            "integrity fingerprint only",
            "does not establish copyright ownership",
            "issue #5 remains open",
        )'''
          new_required = '''        required = (
            "not a license grant",
            "third-party deployable logo artwork: none",
            "current source tree",
            "historical commits may still contain prior third-party artwork blobs",
            "integrity fingerprint only",
            "does not establish copyright ownership",
            "issue #5 remains open",
            "explicit repository visibility/publication decision",
        )'''
          if text.count(old_required) != 1:
              raise SystemExit(f"Expected one legacy publication-boundary marker block; found {text.count(old_required)}")
          test_path.write_text(text.replace(old_required, new_required, 1), encoding="utf-8")
          PY
          git rm scripts/apply_v521_native_platform_marks.py .github/workflows/v521-final-migration.yml

      - name: Validate workflow supply chain
        run: python scripts/validate_workflow_security.py

      - name: Validate repository hygiene
        run: python scripts/validate_repository_hygiene.py

      - name: Validate reachable repository history
        run: python scripts/validate_repository_history.py

      - name: Validate source license
        run: python scripts/validate_license.py

      - name: Validate public asset rights boundary during migration
        if: steps.v521.outputs.active == 'true'
        run: python scripts/validate_public_assets.py

      - name: Validate GoreeCloud governance readiness
        run: python scripts/validate_governance_readiness.py

      - name: Validate repository portfolio integrity
        run: python scripts/validate_repository_portfolio.py

      - name: Validate public runtime status integrity
        run: python scripts/validate_public_runtime_status.py

      - name: Validate security reporting
        run: python scripts/validate_security_policy.py

      - name: Validate Wardveil Security and observability
        run: python scripts/validate_wardveil_observability.py

      - name: Validate privacy statement
        run: python scripts/validate_privacy_policy.py

      - name: Validate browser origin integrity
        run: python scripts/validate_browser_origin_integrity.py

      - name: Validate structural accessibility
        run: python scripts/validate_accessibility.py

      - name: Validate Glaze UI design contract
        run: python scripts/validate_glaze_ui.py

      - name: Validate application identity
        run: python scripts/validate_app_identity.py

      - name: Validate public semantics
        run: python scripts/validate_public_semantics.py

      - name: Validate full public surface
        run: python scripts/validate_public_surface.py

      - name: Validate Cloudflare deployment contract
        run: python scripts/validate_deployment_contract.py

      - name: Validate performance budget
        run: python scripts/validate_performance_budget.py

      - name: Build isolated public artifact
        run: python scripts/build_public_site.py

      - name: Validate isolated public artifact
        run: python scripts/validate_build_artifact.py

      - name: Validate remote verifier configuration
        run: python scripts/verify_remote_deployment.py --check-config

      - name: Test remote deployment verifier
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Validate repository guidance
        run: python scripts/validate_repository_guidance.py

      - name: Validate release evidence records
        run: python scripts/validate_release_evidence.py

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.0"

      - name: Validate public website
        run: python scripts/validate_site.py

      - name: Validate failure resilience
        run: python scripts/validate_resilience.py

      - name: Check JavaScript syntax
        run: |
          node --check js/theme-init.js
          node --check js/main.js

      - name: Commit validated v5.21 release source
        if: steps.v521.outputs.active == 'true'
        run: |
          git config user.name "GoreeCloud Release Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Minimize public artwork and unify platform marks"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Verify pull request branch preview deployment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.v521.outputs.active != 'true'
        run: |
          attempts=6
          for attempt in 1 2 3 4 5 6; do
            if python scripts/verify_remote_deployment.py --target branch-preview; then
              exit 0
            fi
            if [ "$attempt" -lt "$attempts" ]; then
              echo "Branch preview not ready or not yet candidate-identical (attempt $attempt/$attempts); retrying in 10 seconds."
              sleep 10
            fi
          done
          echo "Branch preview verification failed after $attempts attempts."
          exit 1

      - name: Verify production deployment after main update
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          attempts=6
          for attempt in 1 2 3 4 5 6; do
            if python scripts/verify_remote_deployment.py --target production; then
              exit 0
            fi
            if [ "$attempt" -lt "$attempts" ]; then
              echo "Production deployment not ready or not yet candidate-identical (attempt $attempt/$attempts); retrying in 10 seconds."
              sleep 10
            fi
          done
          echo "Production deployment verification failed after $attempts attempts."
          exit 1
