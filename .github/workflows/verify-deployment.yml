name: Verify deployed website
run-name: Verify GoreeCloud deployed website

on:
  workflow_dispatch:
    inputs:
      target:
        description: GoreeCloud deployment target to verify
        required: true
        type: choice
        default: branch-preview
        options:
          - branch-preview
          - production
  schedule:
    - cron: '17 8 * * *'
      timezone: America/Chicago

permissions:
  contents: read

concurrency:
  group: website-remote-verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Validate verifier configuration
        run: python scripts/verify_remote_deployment.py --check-config

      - name: Verify manually selected deployment
        if: github.event_name == 'workflow_dispatch'
        env:
          TARGET: ${{ inputs.target }}
        run: python scripts/verify_remote_deployment.py --target "$TARGET"

      - name: Verify scheduled production deployment
        if: github.event_name == 'schedule'
        run: python scripts/verify_remote_deployment.py --target production
