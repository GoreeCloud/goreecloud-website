name: Verify August 24 production information refresh

on:
  pull_request:
    paths:
      - ".github/workflows/verify-production-information-refresh.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out exact verification revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify primary website production artifact
        run: |
          attempts=6
          for attempt in 1 2 3 4 5 6; do
            if python3 scripts/verify_remote_deployment.py --target production; then
              break
            fi
            if [ "$attempt" -eq "$attempts" ]; then
              echo "Primary production verification failed after $attempts attempts."
              exit 1
            fi
            echo "Primary production is not yet candidate-identical (attempt $attempt/$attempts); retrying in 10 seconds."
            sleep 10
          done

      - name: Verify Projects, Roadmap, Blog, and Archive production bytes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, build_opener
          import hashlib
          import time

          checks = {
              "projects": (Path("sites/projects/assets/app.js"), "https://projects.goreecloud.com/assets/app.js"),
              "roadmap": (Path("sites/roadmap/index.html"), "https://roadmap.goreecloud.com/"),
              "blog": (Path("sites/blog/index.html"), "https://blog.goreecloud.com/"),
              "archive": (Path("sites/archive/index.html"), "https://archive.goreecloud.com/"),
          }
          allowed_hosts = {url.split("/", 3)[2] for _, url in checks.values()}
          opener = build_opener()

          def fetch(url):
              req = Request(url, headers={"User-Agent": "GoreeCloud-Aug24-Production-Verifier/1.0", "Accept-Encoding": "identity"})
              try:
                  with opener.open(req, timeout=15) as response:
                      host = response.geturl().split("/", 3)[2]
                      if host not in allowed_hosts:
                          raise RuntimeError(f"unsafe redirect host for {url}: {host}")
                      return response.status, response.read()
              except HTTPError as exc:
                  return exc.code, exc.read()
              except URLError as exc:
                  raise RuntimeError(f"request failed for {url}: {exc.reason}") from exc

          for attempt in range(1, 7):
              failures = []
              for name, (source, url) in checks.items():
                  expected = source.read_bytes()
                  status, body = fetch(url)
                  if status != 200 or body != expected:
                      failures.append((name, url, status, hashlib.sha256(expected).hexdigest(), hashlib.sha256(body).hexdigest()))
              if not failures:
                  print("Primary and four goreecloud-website production destinations are source-identical.")
                  break
              if attempt == 6:
                  for name, url, status, expected_sha, actual_sha in failures:
                      print(f"{name}: {url} status={status} expected={expected_sha} actual={actual_sha}")
                  raise SystemExit("satellite production verification failed")
              print(f"Satellite production not yet exact (attempt {attempt}/6); retrying in 10 seconds.")
              time.sleep(10)
          PY
